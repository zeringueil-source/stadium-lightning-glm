name: Fetch NEXRAD radar data

on:
  schedule:
    # Every 5 minutes. NEXRAD volume scans complete roughly every 4-10 min
    # depending on the site's VCP (scan strategy), so this keeps pace
    # without hammering the bucket for sites configured in sites.txt.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 metpy numpy

      - name: Fetch latest NEXRAD data for configured sites
        run: python fetch_nexrad.py

      - name: Commit and push if changed
        run: |
          git config user.name "nexrad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nexrad/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NEXRAD data [skip ci]"
            git push
          fi
